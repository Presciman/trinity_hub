# The Trace Agent of the HPC Execution UI — a GPU execution-timeline analyst over
# Nsight Systems profiles and TensorFlow profiler traces, reduced offline to bubble reports.
# Status is `pending` while its public TLS host + token are finalized (then it flips to `active`).

schema: trinity.hub.agent/v1

id: hpc-trace-agent
name: HPC Trace Agent
owner: "Baixi Sun — Argonne National Laboratory (ALCF)"

maintainers:
  - github: Presciman
    contact: sunbaixi@163.com

type: external
protocol: a2a

discovery:
  card_url: https://<HOST>/.well-known/agent-card.json   # final HTTPS host delivered out of band

auth:
  scheme: bearer            # dedicated, revocable token exchanged out of band — never in this repo

domains:
  - gpu-performance
  - profiling
  - execution-traces
  - nsight-systems
  - tensorflow-profiler

description: >-
  GPU execution-timeline analyst for Nsight Systems profiles and TensorFlow profiler traces.
  Its subject is the bubble — an interval in which no kernel, memcpy or memset is executing
  and the device is idle while the wall clock runs. It reports occupancy, locates the gaps
  that matter, attributes each to the ops that bracket it, and bounds the time a fix could
  recover. It separates one large stall from ten thousand small ones, because the remedy
  differs, and never reads occupancy as efficiency.

skills:
  - id: gpu-bubble-analysis
    description: >-
      Locate device-wide idle gaps in an execution timeline — every op merged into disjoint
      busy spans and inverted, so concurrent streams are never double-counted — and quantify
      each as a share of the observed span.
  - id: stall-attribution
    description: >-
      Attribute a bubble to the ops that bracket it: a host blocking on a device-to-host copy,
      an input pipeline failing to keep up, rank skew after a collective, or a per-iteration
      host round trip.
  - id: timeline-headroom-estimate
    description: >-
      Bound the recoverable time from span-over-busy headroom, presented as a ceiling rather
      than a speedup, and say whether the idle time is concentrated in one stall or spread
      across a launch-bound pattern.
  - id: trace-comparison
    description: >-
      Compare runs only on fields that are comparable across traces — relative starts,
      fractions, rates and counts, never run-local tracer clocks — and flag salvaged traces
      that cover a prefix only.

homepage: https://www.sunbaixi.com
icon: "⏱️"
color: "#8b5cf6"

status: pending
added: "2026-10"
